[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "loma-lang"
version = "1.0.0"
description = "LOMA: a deterministic text language for music that compiles to MIDI"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["music", "midi", "compiler", "llm"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Multimedia :: Sound/Audio :: MIDI",
]

[project.scripts]
loma = "loma.cli:main"

[tool.setuptools]
packages = ["loma"]
