[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "loma-lang"
version = "1.2.0"
description = "LOMA: a deterministic text language for music that compiles to MIDI"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Manuel Lomartire" }]
keywords = ["music", "midi", "compiler", "llm"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "License :: OSI Approved :: MIT License",
    "Topic :: Multimedia :: Sound/Audio :: MIDI",
]

[project.urls]
Homepage = "https://manuellomartire.github.io/loma/"
Repository = "https://github.com/manuellomartire/loma"
Documentation = "https://github.com/manuellomartire/loma/blob/main/SPEC.md"
Changelog = "https://github.com/manuellomartire/loma/blob/main/CHANGELOG.md"

[project.scripts]
loma = "loma.cli:main"

[tool.setuptools]
packages = ["loma"]
