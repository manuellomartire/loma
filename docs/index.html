    if (tick > 0) events.push({ tick: tick, kind: "meter", track: -1, ch: 0, pitch: 0, seq: 0, data: { num: meterMap.get(tick)[0], den: meterMap.get(tick)[1] } });
  }
  for (const tick of Array.from(keyMap.keys()).sort((a, b) => a - b)) {
    if (tick > 0) events.push({ tick: tick, kind: "key", track: -1, ch: 0, pitch: 0, seq: 0, data: { sf: keyMap.get(tick)[0], mi: keyMap.get(tick)[1] } });
  }

  const resolved = [];
  const counters = song.tracks.map(() => 0);
  for (const track of song.tracks) {
    let c = 0;
    // voice by voice: ties stay inside a voice
    for (const voice of Array.from(trackItems[track.index].keys()).sort((a, b) => a - b)) {
      const items = trackItems[track.index].get(voice);
      const [cont, total] = resolveTies(track, items, errors);
      items.forEach((it, i) => {
        if (it.kind === "ctl") {
          for (const [tick, kind, data] of it.controls) {
            if (tick > MAX_TICK) {
              errors.push(new LomaError("E018", "event at tick " + tick + " exceeds the maximum " + MAX_TICK, it.line, it.ctx));
              break;
            }
            events.push({ tick: tick, kind: kind, track: track.index, ch: track.ch, pitch: 0, seq: c, data: data });
            c++;
          }
        } else if (cont[i] === null) {
          for (const [pitch, m] of it.notes) {
            const sounding = "d" in m ? m.d : Math.max(1, floorDiv(total[i] * GATE_PCT.get(m.a), 100));
            const start = Math.max(0, it.pos + m.o);
            resolved.push({ track: track, pitch: pitch, vel: m.v, start: start, end: start + sounding, on: c, off: c + 1, line: it.line, ctx: it.ctx });
            c += 2;
          }
        }
      });
    }
    counters[track.index] = c;
  }
  for (const at of song.ats) {
    if (at.kind === "tempo" || at.kind === "meter" || at.kind === "key") continue;
    const c = counters[at.track.index];
    const ctx = { track: at.track.name };
    if (at.kind === "note") {
      budget.add(1, 0, at.line);
      resolved.push({ track: at.track, pitch: at.pitch, vel: at.v, start: at.tick, end: at.tick + at.d, on: c, off: c + 1, line: at.line, ctx: ctx });
      counters[at.track.index] = c + 2;
      continue;
    }
    budget.add(0, 1, at.line);
    const data = at.kind === "cc" ? { controller: at.num, value: at.value } : at.kind === "bend" ? { value: at.value } : { text: at.text };
    events.push({ tick: at.tick, kind: at.kind, track: at.track.index, ch: at.track.ch, pitch: 0, seq: c, data: data });
    counters[at.track.index] = c + 1;
  }

  const groups = new Map();
  for (const n of resolved) {
    const key = n.track.ch * 128 + n.pitch;
    if (!groups.has(key)) groups.set(key, []);
    groups.get(key).push(n);
  }
  for (const key of Array.from(groups.keys()).sort((a, b) => a - b)) {
    const lst = groups.get(key).slice().sort((a, b) => (a.start - b.start) || (a.on - b.on));
    for (let i = 0; i + 1 < lst.length; i++) {
      const a = lst[i], b = lst[i + 1];
      if (a.start === b.start) {
        errors.push(new LomaError("E017", "duplicate note: pitch " + b.pitch + " starts twice at tick " + b.start + " on channel " + b.track.ch, b.line, b.ctx));
      } else if (a.end > b.start) {
        a.end = b.start;
      }
    }
  }
  for (const n of resolved) {
    if (n.end > MAX_TICK) errors.push(new LomaError("E018", "event at tick " + n.end + " exceeds the maximum " + MAX_TICK, n.line, n.ctx));
  }
  if (errors.length > 0) throw new LomaErrors(errors);

  for (const n of resolved) {
    events.push({ tick: n.start, kind: "note_on", track: n.track.index, ch: n.track.ch, pitch: n.pitch, seq: n.on, data: { vel: n.vel } });
    events.push({ tick: n.end, kind: "note_off", track: n.track.index, ch: n.track.ch, pitch: n.pitch, seq: n.off, data: {} });
  }
  const keyed = events.map((e) => [eventKey(e), e]);
  keyed.sort((a, b) => compareKeys(a[0], b[0]));
  const sorted = keyed.map((x) => x[1]);
  let endTick = totalLen;
  for (const e of sorted) if (e.tick > endTick) endTick = e.tick;
  return { song: song, events: sorted, endTick: endTick, bars: timeline.map((x) => x[2]), meter: meterMap.get(0), key: keyMap.get(0) };
}

// ---------------------------------------------------------------------------- output

function eventObject(e, trackNames) {
  if (e.kind === "tempo") return { bpm: e.data.bpm, tick: e.tick, type: e.kind };
  if (e.kind === "meter") return { den: e.data.den, num: e.data.num, tick: e.tick, type: e.kind };
  if (e.kind === "key") return { mi: e.data.mi, sf: e.data.sf, tick: e.tick, type: e.kind };
  const track = trackNames[e.track];
  if (e.kind === "lyric") return { text: e.data.text, tick: e.tick, track: track, type: e.kind };
  if (e.kind === "note_on") return { ch: e.ch, pitch: e.pitch, tick: e.tick, track: track, type: e.kind, vel: e.data.vel };
  if (e.kind === "note_off") return { ch: e.ch, pitch: e.pitch, tick: e.tick, track: track, type: e.kind };
  if (e.kind === "cc") return { ch: e.ch, controller: e.data.controller, tick: e.tick, track: track, type: e.kind, value: e.data.value };
  return { ch: e.ch, tick: e.tick, track: track, type: e.kind, value: e.data.value };
}

function canonicalJson(compiled) {
  const names = compiled.song.tracks.map((t) => t.name);
  return "[" + compiled.events.map((e) => JSON.stringify(eventObject(e, names))).join(",") + "]\n";
}

function utf8(text) {
  return Array.from(new TextEncoder().encode(text));
}

function meta(kind, payload) {
  return [0xFF, kind].concat(vlq(payload.length), payload);
}

function u32(n) {
  return [(n >>> 24) & 0xFF, (n >>> 16) & 0xFF, (n >>> 8) & 0xFF, n & 0xFF];
}

function trackBytes(events, endTick) {
  const out = [];
  let prev = 0;
  for (const [tick, data] of events) {
    for (const b of vlq(tick - prev)) out.push(b);
    for (const b of data) out.push(b);
    prev = tick;
  }
  for (const b of vlq(endTick - prev)) out.push(b);
  out.push(0xFF, 0x2F, 0x00);
  return [0x4D, 0x54, 0x72, 0x6B].concat(u32(out.length), out);
}

function encode(e, status) {
  if (e.kind === "note_on") return [0x90 | status, e.pitch, e.data.vel];
  if (e.kind === "note_off") return [0x80 | status, e.pitch, 0x40];
  if (e.kind === "cc") return [0xB0 | status, e.data.controller, e.data.value];
  if (e.kind === "bend") {
    const value = e.data.value + 8192;
    return [0xE0 | status, value & 0x7F, value >> 7];
  }
  return meta(0x05, utf8(e.data.text));
}

function writeMidi(compiled) {
  const song = compiled.song;
  const end = compiled.endTick;
  const conductor = [];
  if (song.title !== null) conductor.push([0, meta(0x03, utf8(song.title))]);
  const timeSignature = (num, den) => meta(0x58, [num, VALID_DENOMINATORS.indexOf(den), 24, 8]);
  const keySignature = (sf, mi) => meta(0x59, [sf & 0xFF, mi]);
  conductor.push([0, timeSignature(compiled.meter[0], compiled.meter[1])]);
  if (compiled.key !== null) conductor.push([0, keySignature(compiled.key[0], compiled.key[1])]);
  for (const e of compiled.events) {
    if (e.kind === "tempo") {
      const us = floorDiv(60000000, e.data.bpm);
      conductor.push([e.tick, meta(0x51, [(us >> 16) & 0xFF, (us >> 8) & 0xFF, us & 0xFF])]);
    } else if (e.kind === "meter") {
      conductor.push([e.tick, timeSignature(e.data.num, e.data.den)]);
    } else if (e.kind === "key") {
      conductor.push([e.tick, keySignature(e.data.sf, e.data.mi)]);
    }
  }
  const perTrack = song.tracks.map(() => []);
  for (const e of compiled.events) if (e.track >= 0) perTrack[e.track].push(e);

  const chunks = [trackBytes(conductor, end)];
  for (const t of song.tracks) {
    const evs = [[0, meta(0x03, utf8(t.name))]];
    if (t.kind !== "drums") evs.push([0, [0xC0 | (t.ch - 1), t.program]]);
    for (const e of perTrack[t.index]) evs.push([e.tick, encode(e, t.ch - 1)]);
    chunks.push(trackBytes(evs, end));
  }
  const header = [0x4D, 0x54, 0x68, 0x64, 0, 0, 0, 6, 0, 1, (chunks.length >> 8) & 0xFF, chunks.length & 0xFF, (PPQ >> 8) & 0xFF, PPQ & 0xFF];
  const out = new Uint8Array(header.length + chunks.reduce((n, c) => n + c.length, 0));
  out.set(header, 0);
  let offset = header.length;
  for (const c of chunks) {
    out.set(c, offset);
    offset += c.length;
  }
  return out;
}

function compileText(text) {
  const r = parsePartial(text);
  if (r.errors.length > 0) throw new LomaErrors(r.errors.concat(r.checkable ? checkBars(r.song) : []));
  const compiled = compileSong(r.song);
  return { compiled: compiled, midi: writeMidi(compiled) };
}


// ---------------------------------------------------------------------------- MIDI -> LOMA

class MidiError extends Error {}

function readVlq(data, i) {
  let n = 0;
  for (let k = 0; k < 4; k++) {
    if (i >= data.length) throw new MidiError("truncated variable-length quantity");
    const c = data[i++];
    n = n * 128 + (c & 0x7F);
    if (!(c & 0x80)) return [n, i];
  }
  throw new MidiError("variable-length quantity longer than 4 bytes");
}

function readTrack(body) {
  const events = [];
  let i = 0, tick = 0, status = null;
  while (i < body.length) {
    let delta;
    [delta, i] = readVlq(body, i);
    tick += delta;
    if (i >= body.length) throw new MidiError("truncated track");
    const first = body[i];
    if (first === 0xFF) {
      if (i + 1 >= body.length) throw new MidiError("truncated meta event");
      const kind = body[i + 1];
      const [length, j] = readVlq(body, i + 2);
      if (j + length > body.length) throw new MidiError("truncated meta event");
      events.push([tick, "meta", kind, body.slice(j, j + length)]);
      i = j + length;
      status = null;
    } else if (first === 0xF0 || first === 0xF7) {
      const [length, j] = readVlq(body, i + 1);
      if (j + length > body.length) throw new MidiError("truncated sysex event");
      events.push([tick, "sysex", first, body.slice(j, j + length)]);
      i = j + length;
      status = null;
    } else {
      if (first & 0x80) {
        status = first;
        i++;
      } else if (status === null) {
        throw new MidiError("data byte without a running status");
      }
      const hi = status & 0xF0;
      if (hi === 0xF0) throw new MidiError("unsupported system message 0x" + status.toString(16).toUpperCase().padStart(2, "0"));
      const size = hi === 0xC0 || hi === 0xD0 ? 1 : 2;
      if (i + size > body.length) throw new MidiError("truncated channel event");
      const data = Array.from(body.slice(i, i + size));
      if (data.some((b) => b & 0x80)) throw new MidiError("invalid data byte in channel event");
      events.push([tick, "midi", status, data]);
      i += size;
    }
  }
  return events;
}

function be(data, i, n) {
  let v = 0;
  for (let k = 0; k < n; k++) v = v * 256 + data[i + k];
  return v;
}

function readMidi(data) {
  const tag = (i) => String.fromCharCode(data[i], data[i + 1], data[i + 2], data[i + 3]);
  if (data.length < 14 || tag(0) !== "MThd" || be(data, 4, 4) < 6) throw new MidiError("not a Standard MIDI File");
  const hlen = be(data, 4, 4), fmt = be(data, 8, 2), ntracks = be(data, 10, 2), division = be(data, 12, 2);
  if (fmt !== 0 && fmt !== 1) throw new MidiError("unsupported MIDI format " + fmt + " (only 0 and 1)");
  if (division & 0x8000 || division === 0) throw new MidiError("SMPTE time division is not supported");
  let i = 8 + hlen;
  const tracks = [];
  while (i + 8 <= data.length && tracks.length < ntracks) {
    const name = tag(i), length = be(data, i + 4, 4);
    const body = data.slice(i + 8, i + 8 + length);
    if (body.length !== length) throw new MidiError("truncated chunk");
    i += 8 + length;
    if (name === "MTrk") tracks.push(readTrack(body));
  }
  if (tracks.length !== ntracks) throw new MidiError("expected " + ntracks + " tracks, found " + tracks.length);
  return { format: fmt, division: division, tracks: tracks };
}

function pitchName(pitch, drums) {
  if (drums) {
    for (const [name, value] of DRUMS) if (value === pitch) return name;
    return "m" + pitch;
  }
  return NOTE_NAMES[pitch % 12] + (Math.floor(pitch / 12) - 1);
}

function exactBpm(us) {
  const guess = Math.max(4, Math.min(400, floorDiv(60000000, Math.max(us, 1))));
  for (const bpm of [guess, guess + 1, guess - 1]) {
    if (bpm >= 4 && bpm <= 400 && floorDiv(60000000, bpm) === us) return [bpm, true];
  }
  return [guess, false];
}

function metaText(raw) {
  return new TextDecoder("utf-8").decode(Uint8Array.from(raw)).replace(/"/g, "'").replace(/[\n\r]/g, " ");
}

// MIDI bytes -> { source, warnings }. Every event becomes an 'at' statement at its exact tick,
// so a file produced by a LOMA compiler compiles back to the same bytes.
function decompile(data) {
  const midi = readMidi(data);
  const fmt = midi.format, division = midi.division;
  const warnings = [];
  const dropped = new Set();

  const scale = (tick) => {
    if ((tick * PPQ) % division !== 0) {
      throw new MidiError("tick " + tick + " cannot be converted exactly from " + division + " to " + PPQ + " ticks per quarter");
    }
    const t = (tick * PPQ) / division;
    if (t > MAX_TICK) throw new MidiError("the file is longer than the LOMA maximum of " + MAX_TICK + " ticks");
    return t;
  };

  let title = null, end = 0;
  const meters = new Map(), keys = new Map();     // tick -> last signature written at that tick
  const tempos = new Map(), channels = new Map(), names = new Map(), lyrics = new Map(), openNotes = new Map();
  const silent = [];

  midi.tracks.forEach((events, ti) => {
    let hasChannelEvent = false;
    events.forEach(([tick, kind, a, b], seq) => {
      const t = scale(tick);
      end = Math.max(end, t);
      if (kind === "sysex") {
        dropped.add("system exclusive messages");
      } else if (kind === "meta") {
        if (a === 0x03) {
          if (ti === 0 && fmt === 1) title = metaText(b);
          else names.set(ti, metaText(b));
        } else if (a === 0x58 && b.length >= 2) {
          meters.set(t, [b[0], Math.pow(2, b[1])]);
        } else if (a === 0x59 && b.length >= 2) {
          keys.set(t, [b[0] > 127 ? b[0] - 256 : b[0], b[1]]);
        } else if (a === 0x51 && b.length === 3) {
          tempos.set(t, be(b, 0, 3));
        } else if (a === 0x05) {
          const text = metaText(b);
          if (text !== "") {
            if (!lyrics.has(ti)) lyrics.set(ti, []);
            lyrics.get(ti).push([t, seq, text]);
          }
        } else if (a !== 0x2F) {
          dropped.add("meta event 0x" + a.toString(16).toUpperCase().padStart(2, "0"));
        }
      } else {
        hasChannelEvent = true;
        const ch = (a & 0x0F) + 1, hi = a & 0xF0;
        if (!channels.has(ch)) channels.set(ch, { ch: ch, track: ti, program: null, notes: [], others: [] });
        const info = channels.get(ch);
        const noteKey = ch * 128 + b[0];
        if (hi === 0x90 && b[1] > 0) {
          if (!openNotes.has(noteKey)) openNotes.set(noteKey, []);
          openNotes.get(noteKey).push([t, b[1], seq, ti]);
        } else if (hi === 0x80 || hi === 0x90) {
          const pending = openNotes.get(noteKey);
          if (pending && pending.length > 0) {
            const [start, vel, sq, tj] = pending.shift();
            if (t === start) warnings.push("zero-length note at tick " + start + " lengthened to 1 tick");
            info.notes.push([start, tj, sq, b[0], Math.max(1, t - start), vel]);
          }
        } else if (hi === 0xB0) {
          info.others.push([t, ti, seq, "cc" + b[0] + "=" + b[1]]);
        } else if (hi === 0xE0) {
          info.others.push([t, ti, seq, "bend=" + ((b[1] * 128 + b[0]) - 8192)]);
        } else if (hi === 0xC0) {
          if (info.program === null) info.program = b[0];
          else if (info.program !== b[0]) dropped.add("program changes after the first one");
        } else {
          dropped.add("aftertouch messages");
        }
      }
    });
    if (!hasChannelEvent && (ti > 0 || fmt === 0)) silent.push(ti);
  });
  for (const noteKey of Array.from(openNotes.keys()).sort((x, y) => x - y)) {
    const ch = Math.floor(noteKey / 128), pitch = noteKey % 128;
    for (const [start, vel, sq, tj] of openNotes.get(noteKey)) {
      warnings.push("note " + pitch + " on channel " + ch + " at tick " + start + " has no note-off: ended at the end of the file");
      channels.get(ch).notes.push([start, tj, sq, pitch, Math.max(1, end - start), vel]);
    }
  }

  const owners = new Map();
  for (const info of channels.values()) {
    if (!owners.has(info.track)) owners.set(info.track, []);
    owners.get(info.track).push(info.ch);
  }
  const decl = [];
  for (const info of channels.values()) {
    const wanted = owners.get(info.track).length === 1 && names.has(info.track) ? names.get(info.track) : null;
    decl.push([[info.track, info.ch], wanted, info.ch]);
  }
  let emptyDrums = null;              // MIDI track taken as a drums track without notes
  for (const ti of silent) {
    if (names.has(ti) && !channels.has(10) && emptyDrums === null) {
      decl.push([[ti, 0], names.get(ti), null]);
      emptyDrums = ti;
    } else if (names.has(ti)) {
      dropped.add("empty tracks");
    }
  }
  decl.sort((x, y) => (x[0][0] - y[0][0]) || (x[0][1] - y[0][1]));
  for (const ti of lyrics.keys()) {
    if ((owners.get(ti) || []).length !== 1 && ti !== emptyDrums) dropped.add("lyrics in tracks that do not own exactly one channel");
  }

  const validMeter = (m) => m[0] >= 1 && m[0] <= 64 && VALID_DENOMINATORS.includes(m[1]);
  const keyNameOf = (k) => {
    let found = null;
    for (const [name, sf] of k[1] === 0 ? KEY_MAJOR : k[1] === 1 ? KEY_MINOR : []) {
      if (sf === k[0]) found = name + (k[1] === 1 ? "m" : "");
    }
    return found;
  };
  let meter = meters.has(0) ? meters.get(0) : null;
  const key = keys.has(0) ? keys.get(0) : null;
  meters.delete(0);
  keys.delete(0);
  const byTick = (map) => Array.from(map.keys()).sort((x, y) => x - y);
  const meterAts = byTick(meters).filter((t) => validMeter(meters.get(t))).map((t) => [t, meters.get(t)]);
  const keyAts = byTick(keys).filter((t) => keyNameOf(keys.get(t)) !== null).map((t) => [t, keyNameOf(keys.get(t))]);
  if (meterAts.length < meters.size) dropped.add("unsupported time signatures");
  if (keyAts.length < keys.size) dropped.add("invalid key signature");
  const out = [meterAts.length > 0 || keyAts.length > 0 ? "loma 1.1" : "loma 1.0"];
  if (title !== null) out.push('title "' + title + '"');
  if (!tempos.has(0)) {
    warnings.push("no tempo at tick 0: 120 BPM assumed");
    out.push("tempo 120");
  } else {
    const firstUs = tempos.get(0);
    tempos.delete(0);
    const [bpm, exact] = exactBpm(firstUs);
    if (!exact) warnings.push("tempo " + firstUs + " us per quarter is not an integer BPM: " + bpm + " BPM used");
    out.push("tempo " + bpm);
  }
  if (meter === null) {
    meter = [4, 4];
  } else if (!validMeter(meter)) {
    warnings.push("time signature " + meter[0] + "/" + meter[1] + " is not supported: 4/4 used");
    meter = [4, 4];
  }
  out.push("meter " + meter[0] + "/" + meter[1]);
  if (key !== null) {
    const keyName = keyNameOf(key);
    if (keyName !== null) out.push("key " + keyName);
    else dropped.add("invalid key signature");
  }
  out.push("");

  const used = new Set(), trackNames = new Map();
  const unique = (wanted, fallback) => {
    let name = wanted && NAME_FULL.test(wanted) && !RESERVED.has(wanted) ? wanted : fallback;
    const base = name;
    for (let n = 2; used.has(name); n++) name = base + "_" + n;
    used.add(name);
    return name;
  };
  for (const [, wanted, ch] of decl) {
    if (ch === null || ch === 10) {
      trackNames.set(10, unique(wanted, "drumkit"));
      out.push("track " + trackNames.get(10) + " drums");
    } else {
      trackNames.set(ch, unique(wanted, "ch" + ch));
      out.push("track " + trackNames.get(ch) + " ch=" + ch + " program=" + (channels.get(ch).program || 0));
    }
  }
  out.push("", "section main");
  if (end > 0) out.push("  bar C len=/#" + end);
  out.push("end", "play main", "");

  for (const t of Array.from(tempos.keys()).sort((x, y) => x - y)) {
    const [bpm, exact] = exactBpm(tempos.get(t));
    if (!exact) warnings.push("tempo " + tempos.get(t) + " us per quarter at tick " + t + " is not an integer BPM: " + bpm + " BPM used");
    out.push("at " + t + " tempo=" + bpm);
  }
  for (const [t, m] of meterAts) out.push("at " + t + " meter=" + m[0] + "/" + m[1]);
  for (const [t, name] of keyAts) out.push("at " + t + " key=" + name);
  for (const [order, , ch] of decl) {
    if (ch === null) {                // the drums track without notes: it can still carry lyrics
      const words = (lyrics.get(order[0]) || []).slice().sort((x, y) => (x[0] - y[0]) || (x[1] - y[1]));
      for (const [t, , text] of words) out.push("at " + t + " " + trackNames.get(10) + ' "' + text + '"');
      continue;
    }
    const info = channels.get(ch), name = trackNames.get(ch);
    const lines = [], starts = new Set();
    for (const [start, ti, seq, pitch, dur, vel] of info.notes) {
      const startKey = pitch + ":" + start;
      if (starts.has(startKey)) {
        warnings.push("duplicate note " + pitch + " at tick " + start + " on channel " + ch + " dropped");
        continue;
      }
      starts.add(startKey);
      lines.push([start, ti, seq, "at " + start + " " + name + " " + pitchName(pitch, ch === 10) + " d=" + dur + " v=" + vel]);
    }
    for (const [t, ti, seq, text] of info.others) lines.push([t, ti, seq, "at " + t + " " + name + " " + text]);
    if (owners.get(info.track).length === 1) {
      for (const [t, seq, text] of lyrics.get(info.track) || []) lines.push([t, info.track, seq, "at " + t + " " + name + ' "' + text + '"']);
    }
    lines.sort((x, y) => (x[0] - y[0]) || (x[1] - y[1]) || (x[2] - y[2]));
    for (const line of lines) out.push(line[3]);
  }
  for (const what of Array.from(dropped).sort()) warnings.push("not representable in LOMA, dropped: " + what);
  return { source: out.join("\n") + "\n", warnings: warnings };
}

const api = { compileText, canonicalJson, parse, compileSong, writeMidi, readMidi, decompile, floorDiv,
  durationTicks, LomaError, LomaErrors, MidiError, PPQ };
if (typeof module === "object" && module && module.exports) module.exports = api;

// ---------------------------------------------------------------------------- command line (Node.js)

function main(argv) {
  const fs = require("fs");
  const crypto = require("crypto");
  const cmd = argv[0];
  const file = argv[1];
  const asJson = argv.includes("--json");
  const outIndex = argv.indexOf("-o");
  if (!["compile", "check", "expand", "hash", "decompile"].includes(cmd) || file === undefined || (cmd === "compile" && outIndex < 0)) {
    process.stderr.write("usage: loma.js compile FILE -o OUT [--json] | check FILE [--json] | expand FILE --json | hash FILE | decompile FILE.mid [-o OUT]\n");
    return 2;
  }
  try {
    const data = fs.readFileSync(file === "-" ? 0 : file);
    if (cmd === "decompile") {
      const result = decompile(new Uint8Array(data));
      for (const w of result.warnings) process.stderr.write("warning: " + w + "\n");
      if (outIndex >= 0) fs.writeFileSync(argv[outIndex + 1], result.source);
      else process.stdout.write(result.source);
      return 0;
    }
    let text;
    try {
      text = new TextDecoder("utf-8", { fatal: true, ignoreBOM: true }).decode(data);
    } catch (e) {
      throw new LomaErrors([new LomaError("E001", "the file is not valid UTF-8", 1)]);
    }
    const { compiled, midi } = compileText(text);
    if (cmd === "check") process.stdout.write(asJson ? "[]\n" : "OK\n");
    else if (cmd === "compile") fs.writeFileSync(argv[outIndex + 1], midi);
    else if (cmd === "expand") process.stdout.write(canonicalJson(compiled));
    else process.stdout.write(crypto.createHash("sha256").update(midi).digest("hex") + "\n");
    return 0;
  } catch (e) {
    if (e instanceof LomaErrors) {
      if (asJson) {
        process.stdout.write(JSON.stringify(e.errors) + "\n");
      } else {
        for (const x of e.errors) process.stderr.write(x.code + " line " + x.line + ": " + x.message + "\n");
        process.stderr.write(e.errors.length + " error(s)\n");
      }
      return 1;
    }
    if (e instanceof MidiError || (e && typeof e.code === "string" && e.syscall)) {
      process.stderr.write("loma: " + e.message + "\n");
      return 2;
    }
    throw e;
  }
}

if (typeof require === "function" && typeof module === "object" && require.main === module) {
  process.exitCode = main(process.argv.slice(2));
}

let playhead = 0;          // ticks
let audio = null, noise = null;

// ------------------------------------------------------------------ model from the compiler output
function buildModel(result) {
  const { compiled, midi } = result;
  const song = compiled.song;
  const tempos = [], notes = [], open = new Map();
  const tracks = song.tracks.map((tr) => ({ name: tr.name, drums: tr.kind === "drums", program: tr.program, cc: [], bends: [], pedal: [], count: 0 }));
  for (const e of compiled.events) {
    if (e.kind === "tempo") tempos.push({ tick: e.tick, bpm: e.data.bpm });
    else if (e.kind === "note_on") {
      const key = e.track * 128 + e.pitch;
      if (!open.has(key)) open.set(key, []);
      open.get(key).push({ track: e.track, pitch: e.pitch, vel: e.data.vel, on: e.tick, off: e.tick });
    } else if (e.kind === "note_off") {
      const n = (open.get(e.track * 128 + e.pitch) || []).shift();
      if (n) { n.off = e.tick; notes.push(n); tracks[e.track].count++; }
    } else if (e.kind === "cc") {
      if (e.data.controller === 64) tracks[e.track].pedal.push({ tick: e.tick, down: e.data.value >= 64 });
      else if (e.data.controller === 7 || e.data.controller === 11) tracks[e.track].cc.push({ tick: e.tick, num: e.data.controller, value: e.data.value });
    } else if (e.kind === "bend") tracks[e.track].bends.push({ tick: e.tick, value: e.data.value });
  }
  let sec = 0;
  const segs = tempos.map((tp, i) => {
    if (i > 0) sec += (tp.tick - tempos[i - 1].tick) * (60 / tempos[i - 1].bpm / LOMA.PPQ);
    return { tick: tp.tick, sec: sec, spt: 60 / tp.bpm / LOMA.PPQ, bpm: tp.bpm };
  });
  const segAt = (value, field) => {
    let lo = 0, hi = segs.length - 1;
    while (lo < hi) { const mid = (lo + hi + 1) >> 1; if (segs[mid][field] <= value) lo = mid; else hi = mid - 1; }
    return segs[lo];
  };
  const tickToSec = (tick) => { const s = segAt(tick, "tick"); return s.sec + (tick - s.tick) * s.spt; };
  const secToTick = (x) => { const s = segAt(x, "sec"); return s.tick + (x - s.sec) / s.spt; };
  const end = compiled.endTick;
  for (const n of notes) {            // the sustain pedal holds a note until it is released
    const pedal = tracks[n.track].pedal;
    let down = false, release = n.off;
    for (const p of pedal) {
      if (p.tick <= n.off) down = p.down;
      else if (down && !p.down) { release = p.tick; down = false; break; }
    }
    if (down) release = end;
    n.onSec = tickToSec(n.on);
    n.offSec = tickToSec(Math.max(release, n.on + 1));
  }
  notes.sort((a, b) => a.on - b.on);
  for (const tr of tracks) {
    for (const c of tr.cc) c.sec = tickToSec(c.tick);
    for (const b of tr.bends) b.sec = tickToSec(b.tick);
  }
  const meterLen = song.meter[0] * (1920 / song.meter[1]);
  let bars = compiled.bars.length > 1 ? compiled.bars.slice() : [];
  if (bars.length === 0) for (let x = 0; x < end; x += meterLen) bars.push(x);
  return { midi, song, tracks, notes, end, bars, tickToSec, secToTick, total: tickToSec(end), bpmAt: (tick) => segAt(tick, "tick").bpm,
    title: song.title || "song" };
}

// ------------------------------------------------------------------ compile and report
function compile() {
  const text = src.value;
  store.set("loma-draft", text);
  dirty = false;
  roll.classList.remove("stale");
  let result = null;
  lastErrors = [];
  try {
    result = LOMA.compileText(text);
  } catch (e) {
    if (!(e instanceof LOMA.LomaErrors)) throw e;
    lastErrors = e.errors;
  }
  if (result) {
    stop();
    model = buildModel(result);
    muted = new Set([...muted].filter((i) => i < model.tracks.length));
    playhead = Math.min(playhead, model.end);
  }
  renderGutter();
  renderStatus();
  if (result) { renderTracks(); renderFacts(); draw(); }
  $("play").disabled = !model || model.notes.length === 0;
  $("saveMidi").disabled = !result;
}

function renderGutter() {
  const bad = new Set(lastErrors.map((e) => e.line));
  const n = src.value.split("\n").length;
  let html = "";
  for (let i = 1; i <= n; i++) html += bad.has(i) ? '<b class="err">' + i + "</b>" : "<b>" + i + "</b>";
  gutter.innerHTML = html;
  gutter.scrollTop = src.scrollTop;
}

function renderStatus() {
  const status = $("status"), list = $("errors");
  list.textContent = "";
  $("copyErrors").hidden = lastErrors.length === 0 || dirty;
  if (dirty) {                                  // the errors below are those of the last compilation
    status.className = "stale";
    status.textContent = t("stale")(MOD_KEY);
  }
  if (dirty && lastErrors.length === 0) return;
  if (lastErrors.length === 0) {
    status.className = "ok";
    status.textContent = t("valid");
    return;
  }
  if (!dirty) {
    status.className = "bad";
    status.textContent = t("errors")(lastErrors.length);
  }
  for (const e of lastErrors) {
    const li = document.createElement("li"), b = document.createElement("button");
    b.type = "button";
    const where = document.createElement("span"), msg = document.createElement("span");
    where.className = "where";
    where.textContent = e.code + " · " + t("line") + " " + e.line;
    msg.className = "msg";
    msg.textContent = e.message;
    b.append(where, msg);
    b.addEventListener("click", () => selectLine(e.line));
    li.append(b);
    list.append(li);
  }
}

function selectLine(line) {
  const lines = src.value.split("\n");
  let start = 0;
  for (let i = 0; i < line - 1 && i < lines.length; i++) start += lines[i].length + 1;
  src.focus();
  src.setSelectionRange(start, start + (lines[line - 1] || "").length);
  src.scrollTop = Math.max(0, (line - 4) * 20);
}

function fmtTime(sec) {
  const s = Math.max(0, Math.floor(sec));
  return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
}

function renderFacts() {
  const m = model, facts = $("facts");
  const rows = [[t("tracks"), m.tracks.length], [t("bars"), m.bars.length], [t("notes"), m.notes.length],
    [t("length"), fmtTime(m.total)], [t("size"), m.midi.length + " " + t("bytes")], [t("hash"), "…"]];
  facts.textContent = "";
  for (const [k, v] of rows) {
    const d = document.createElement("div"), dt = document.createElement("dt"), dd = document.createElement("dd");
    dt.textContent = k;
    dd.textContent = v;
    d.append(dt, dd);
    facts.append(d);
  }
  const cell = facts.lastChild.lastChild, midi = m.midi;
  if (window.crypto && crypto.subtle) {
    crypto.subtle.digest("SHA-256", midi).then((buf) => {
      if (model && model.midi === midi) {
        const hex = Array.from(new Uint8Array(buf)).map((b) => b.toString(16).padStart(2, "0")).join("");
        cell.textContent = hex.slice(0, 16) + "…";
        cell.title = hex;
      }
    }).catch(() => { cell.textContent = "-"; });
  } else cell.textContent = "-";
}

function renderTracks() {
  const box = $("tracks");
  box.textContent = "";
  model.tracks.forEach((tr, i) => {
    const label = document.createElement("label"), cb = document.createElement("input"), sw = document.createElement("i");
    const name = document.createElement("span"), count = document.createElement("small");
    label.style.setProperty("--chip", "var(--t" + (i % 6 + 1) + ")");
    cb.type = "checkbox";
    cb.id = "track-" + i;
    cb.checked = !muted.has(i);
    cb.addEventListener("change", () => {
      if (cb.checked) muted.delete(i); else muted.add(i);
      if (playing) playing.mutes[i].gain.setTargetAtTime(cb.checked ? 1 : 0, audio.currentTime, 0.01);
      draw();
    });
    name.textContent = tr.name;
    count.textContent = tr.count;
    label.append(cb, sw, name, count);
    box.append(label);
  });
}

// ------------------------------------------------------------------ piano roll
function draw() {
  const dpr = window.devicePixelRatio || 1, w = roll.clientWidth, h = roll.clientHeight;
  if (roll.width !== Math.round(w * dpr) || roll.height !== Math.round(h * dpr)) {
    roll.width = Math.round(w * dpr);
    roll.height = Math.round(h * dpr);
  }
  const g = roll.getContext("2d"), css = getComputedStyle(document.documentElement);
  const col = (name) => css.getPropertyValue(name).trim();
  g.setTransform(dpr, 0, 0, dpr, 0, 0);
  g.clearRect(0, 0, w, h);
  if (!model || model.end === 0) {
    g.fillStyle = col("--muted");
    g.font = "13px " + col("--sans");
    g.fillText(t("empty"), 12, 24);
    return;
  }
  const m = model, top = 18, x = (tick) => (tick / m.end) * w;
  const hasDrums = m.tracks.some((tr) => tr.drums && tr.count > 0);
  const drumH = hasDrums ? Math.min(64, h * 0.22) : 0, pitchH = h - top - drumH - (hasDrums ? 6 : 0);
  let lo = 127, hi = 0;
  const drumPitches = new Set();
  for (const n of m.notes) {
    if (m.tracks[n.track].drums) drumPitches.add(n.pitch);
    else { lo = Math.min(lo, n.pitch); hi = Math.max(hi, n.pitch); }
  }
  if (lo > hi) { lo = 48; hi = 72; }
  lo -= 2; hi += 2;
  const rowH = pitchH / (hi - lo + 1);
  const drumRows = Array.from(drumPitches).sort((a, b) => a - b);
  // bar grid and numbers
  const step = Math.max(1, Math.ceil(m.bars.length / Math.max(1, Math.floor(w / 44))));
  g.font = "11px " + col("--mono");
  m.bars.forEach((tick, i) => {
    g.fillStyle = col("--faint");
    g.fillRect(Math.round(x(tick)), top, 1, h - top);
    if (i % step === 0) {
      g.fillStyle = col("--muted");
      g.fillText(String(i + 1), x(tick) + 3, 12);
    }
  });
  for (let p = lo; p <= hi; p++) {      // a faint line at every C
    if (p % 12 === 0) {
      g.fillStyle = col("--faint");
      g.fillRect(0, top + (hi - p + 1) * rowH - 0.5, w, 1);
    }
  }
  if (hasDrums) {
    g.fillStyle = col("--faint");
    g.fillRect(0, top + pitchH + 3, w, 1);
  }
  for (const n of m.notes) {
    const tr = m.tracks[n.track];
    g.globalAlpha = muted.has(n.track) ? 0.18 : 0.45 + 0.55 * (n.vel / 127);
    g.fillStyle = col("--t" + (n.track % 6 + 1));
    const x0 = x(n.on), ww = Math.max(1.5, x(n.off) - x0 - 0.5);
    if (tr.drums) {
      const rh = drumH / Math.max(1, drumRows.length);
      g.fillRect(x0, top + pitchH + 6 + (drumRows.length - 1 - drumRows.indexOf(n.pitch)) * rh, Math.max(2, Math.min(ww, 4)), Math.max(2, rh - 1));
    } else {
      g.fillRect(x0, top + (hi - n.pitch) * rowH, ww, Math.max(2, rowH - 1));
    }
  }
  g.globalAlpha = 1;
  g.fillStyle = col("--ink");
  g.fillRect(Math.round(x(playhead)), 0, 1, h);
  const barIndex = m.bars.filter((b) => b <= playhead).length;
  $("clock").textContent = fmtTime(m.tickToSec(playhead)) + " / " + fmtTime(m.total) + " · " + t("bars").toLowerCase() + " " +
    Math.max(1, barIndex) + " · " + m.bpmAt(playhead) + " BPM";
}

// ------------------------------------------------------------------ synthesizer
function family(program) {
  if (program < 8) return { wave: "triangle", attack: 0.004, decay: 0.9, sustain: 0.0, cutoff: 3200 };       // pianos
  if (program < 16) return { wave: "sine", attack: 0.002, decay: 0.5, sustain: 0.0, cutoff: 6000 };          // mallets
  if (program < 24) return { wave: "square", attack: 0.01, decay: 0.2, sustain: 0.7, cutoff: 1800 };         // organs
  if (program < 32) return { wave: "sawtooth", attack: 0.003, decay: 0.6, sustain: 0.05, cutoff: 2400 };     // guitars
  if (program < 40) return { wave: "triangle", attack: 0.006, decay: 0.5, sustain: 0.5, cutoff: 900 };       // basses
  if (program < 56) return { wave: "sawtooth", attack: 0.09, decay: 0.3, sustain: 0.8, cutoff: 2200 };       // strings, choirs
  if (program < 64) return { wave: "sawtooth", attack: 0.03, decay: 0.2, sustain: 0.75, cutoff: 2600 };      // brass
  if (program < 72) return { wave: "square", attack: 0.03, decay: 0.2, sustain: 0.75, cutoff: 2000 };        // reeds
  if (program < 80) return { wave: "triangle", attack: 0.04, decay: 0.2, sustain: 0.85, cutoff: 3500 };      // flutes
  return { wave: "sawtooth", attack: 0.02, decay: 0.3, sustain: 0.6, cutoff: 2600 };
}

function melodicVoice(n, tr, t0, t1, out) {
  const ctx = audio, f = family(tr.program);
  const osc = ctx.createOscillator(), filter = ctx.createBiquadFilter(), amp = ctx.createGain();
  osc.type = f.wave;
  osc.frequency.value = 440 * Math.pow(2, (n.pitch - 69) / 12);
  const bends = tr.bends;
  if (bends.length) {                    // +-8192 = +-2 semitones
    let lo = 0, hi = bends.length;
    while (lo < hi) { const mid = (lo + hi) >> 1; if (bends[mid].sec <= n.onSec) lo = mid + 1; else hi = mid; }
    osc.detune.setValueAtTime(lo > 0 ? bends[lo - 1].value / 8192 * 200 : 0, t0);
    for (let i = lo; i < bends.length && bends[i].sec < n.offSec; i++) {
      osc.detune.setValueAtTime(bends[i].value / 8192 * 200, t0 + bends[i].sec - n.onSec);
    }
  }
  filter.type = "lowpass";
  filter.frequency.value = f.cutoff * (0.5 + n.vel / 127);
  const peak = Math.pow(n.vel / 127, 1.5) * 0.2;
  amp.gain.setValueAtTime(0, t0);
  amp.gain.linearRampToValueAtTime(peak, t0 + f.attack);
  amp.gain.setTargetAtTime(peak * f.sustain, t0 + f.attack, f.decay / 3);
  amp.gain.setTargetAtTime(0, Math.max(t1, t0 + f.attack), 0.05);
  osc.connect(filter).connect(amp).connect(out);
  osc.start(t0);
  osc.stop(Math.max(t1, t0 + f.attack) + 0.4);
}

const DRUM = {
  36: { tone: [120, 45, 0.12], decay: 0.22 }, 38: { tone: [190, 150, 0.05], noise: [1800, "bandpass"], decay: 0.16 },
  42: { noise: [7000, "highpass"], decay: 0.04 }, 46: { noise: [6000, "highpass"], decay: 0.28 },
  49: { noise: [3800, "highpass"], decay: 1.1 }, 51: { noise: [6500, "highpass"], decay: 0.45 },
  50: { tone: [170, 110, 0.12], decay: 0.25 }, 47: { tone: [125, 80, 0.14], decay: 0.3 },
};

function drumVoice(n, t0, out) {
  const ctx = audio, d = DRUM[n.pitch] || { noise: [3000, "bandpass"], decay: 0.08 };
  const level = Math.pow(n.vel / 127, 1.3) * 0.5;
  if (d.tone) {
    const osc = ctx.createOscillator(), amp = ctx.createGain();
    osc.frequency.setValueAtTime(d.tone[0], t0);
    osc.frequency.exponentialRampToValueAtTime(d.tone[1], t0 + d.tone[2]);
    amp.gain.setValueAtTime(level, t0);
    amp.gain.exponentialRampToValueAtTime(0.0008, t0 + d.decay);
    osc.connect(amp).connect(out);
    osc.start(t0);
    osc.stop(t0 + d.decay + 0.05);
  }
  if (d.noise) {
    const srcNode = ctx.createBufferSource(), filter = ctx.createBiquadFilter(), amp = ctx.createGain();
    srcNode.buffer = noise;
    srcNode.loop = true;
    filter.type = d.noise[1];
    filter.frequency.value = d.noise[0];
    amp.gain.setValueAtTime(level * 0.6, t0);
    amp.gain.exponentialRampToValueAtTime(0.0008, t0 + d.decay);
    srcNode.connect(filter).connect(amp).connect(out);
    srcNode.start(t0, Math.random());
    srcNode.stop(t0 + d.decay + 0.05);
  }
}

function play() {
  if (!model) return;
  if (!audio) {
    audio = new (window.AudioContext || window.webkitAudioContext)();
    noise = audio.createBuffer(1, audio.sampleRate, audio.sampleRate);
    const data = noise.getChannelData(0);
    for (let i = 0; i < data.length; i++) data[i] = Math.random() * 2 - 1;
  }
  audio.resume();
  if (playhead >= model.end) playhead = 0;
  const m = model, offset = m.tickToSec(playhead), start = audio.currentTime + 0.08;
  const master = audio.createGain(), limiter = audio.createDynamicsCompressor();
  master.gain.value = $("volume").value / 100;
  master.connect(limiter).connect(audio.destination);
  const levels = [], mutes = [], state = [];
  m.tracks.forEach((tr, i) => {
    const level = audio.createGain(), mute = audio.createGain();
    const st = { cc7: 100, cc11: 127, next: 0 };
    while (st.next < tr.cc.length && tr.cc[st.next].sec <= offset) { st["cc" + tr.cc[st.next].num] = tr.cc[st.next].value; st.next++; }
    level.gain.value = (st.cc7 / 127) * (st.cc11 / 127);
    mute.gain.value = muted.has(i) ? 0 : 1;
    level.connect(mute).connect(master);
    levels.push(level); mutes.push(mute); state.push(st);
  });
  let index = 0;
  while (index < m.notes.length && m.notes[index].onSec < offset) index++;
  const pump = () => {
    const now = audio.currentTime - start + offset, horizon = now + 0.3;
    m.tracks.forEach((tr, i) => {
      const st = state[i];
      while (st.next < tr.cc.length && tr.cc[st.next].sec < horizon) {
        const c = tr.cc[st.next++];
        st["cc" + c.num] = c.value;
        levels[i].gain.setValueAtTime((st.cc7 / 127) * (st.cc11 / 127), Math.max(audio.currentTime, start + c.sec - offset));
      }
    });
    while (index < m.notes.length && m.notes[index].onSec < horizon) {
      const n = m.notes[index++], tr = m.tracks[n.track];
      const t0 = Math.max(audio.currentTime, start + n.onSec - offset), t1 = start + n.offSec - offset;
      if (tr.drums) drumVoice(n, t0, levels[n.track]); else melodicVoice(n, tr, t0, t1, levels[n.track]);
    }
    if (now >= m.total + 0.4) { stop(); playhead = 0; draw(); }
  };
  playing = { start, offset, master, mutes, timer: setInterval(pump, 30), frame: 0 };
  pump();
  const tick = () => {
    if (!playing) return;
    playhead = Math.min(m.end, Math.max(0, m.secToTick(Math.max(0, audio.currentTime - playing.start + playing.offset))));
    draw();
    playing.frame = requestAnimationFrame(tick);
  };
  playing.frame = requestAnimationFrame(tick);
  $("play").textContent = t("stop");
}

function stop() {
  if (!playing) return;
  clearInterval(playing.timer);
  cancelAnimationFrame(playing.frame);
  const master = playing.master;
  master.gain.setTargetAtTime(0, audio.currentTime, 0.015);
  setTimeout(() => master.disconnect(), 200);
  playing = null;
  $("play").textContent = t("play");
}

// ------------------------------------------------------------------ files
function crc32(bytes) {
  let c, crc = 0xFFFFFFFF;
  for (let i = 0; i < bytes.length; i++) {
    c = (crc ^ bytes[i]) & 0xFF;
    for (let k = 0; k < 8; k++) c = c & 1 ? (c >>> 1) ^ 0xEDB88320 : c >>> 1;
    crc = (crc >>> 8) ^ c;
  }
  return (crc ^ 0xFFFFFFFF) >>> 0;
}

function zipOne(name, bytes) {           // a stored (uncompressed) zip with a single file
  const enc = new TextEncoder().encode(name), crc = crc32(bytes);
  const u16 = (v) => [v & 255, (v >>> 8) & 255], u32 = (v) => [v & 255, (v >>> 8) & 255, (v >>> 16) & 255, (v >>> 24) & 255];
  const common = [].concat(u16(20), u16(0x0800), u16(0), u16(0), u16(0x21), u32(crc), u32(bytes.length), u32(bytes.length), u16(enc.length), u16(0));
  const local = [0x50, 0x4B, 3, 4].concat(common, Array.from(enc));
  const central = [0x50, 0x4B, 1, 2].concat(u16(20), common, u16(0), u16(0), u16(0), u32(0), u32(0), Array.from(enc));
  const endRec = [0x50, 0x4B, 5, 6].concat(u16(0), u16(0), u16(1), u16(1), u32(central.length), u32(local.length + bytes.length), u16(0));
  const out = new Uint8Array(local.length + bytes.length + central.length + endRec.length);
  out.set(local, 0);
  out.set(bytes, local.length);
  out.set(central, local.length + bytes.length);
  out.set(endRec, local.length + bytes.length + central.length);
  return out;
}

function notice(text) {
  const el = $("notice");
  el.textContent = text;
  el.hidden = !text;
}

// ------------------------------------------------------------------ clipboard, theme, links
function copyText(text, button, key) {
  const done = () => { button.textContent = t("copied"); setTimeout(() => { button.textContent = t(key); }, 1200); };
  const fallback = () => {                      // the clipboard is refused in some views: leave the text selected
    const area = document.createElement("textarea");
    area.value = text;
    area.setAttribute("readonly", "");
    area.style.cssText = "position:fixed;left:0;top:0;width:1px;height:1px;opacity:0";
    document.body.append(area);
    area.select();
    let ok = false;
    try { ok = document.execCommand("copy"); } catch (e) { ok = false; }
    area.remove();
    if (ok) done();
    else if (button.id === "copy") { src.focus(); src.select(); }
  };
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(done, fallback);
  else fallback();
}

// The same lines that the command line prints, ready to paste to an AI.
function errorsText() {
  return lastErrors.map((e) => {
    let s = e.code + " line " + e.line;
    if (e.ctx && e.ctx.bar !== undefined) s += " bar " + e.ctx.bar + (e.ctx.chord !== undefined ? " (" + e.ctx.chord + ")" : "");
    if (e.ctx && e.ctx.track !== undefined) s += " track " + e.ctx.track;
    return s + ": " + e.message;
  }).join("\n") + "\n";
}

function isDark() {
  const forced = document.documentElement.getAttribute("data-theme");
  if (forced === "dark" || forced === "light") return forced === "dark";
  return !!(window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches);
}

function renderTheme() {
  $("theme").textContent = t(isDark() ? "themeLight" : "themeDark");
}

// A piece travels in the link as "#z=" (deflate) or "#u=" (plain), both base64url of the UTF-8 source.
const LINK_LIMIT = 60000;
function toBase64Url(bytes) {
  let s = "";
  for (let i = 0; i < bytes.length; i += 0x8000) s += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
  return btoa(s).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
}
function fromBase64Url(text) {
  const s = atob(text.replace(/-/g, "+").replace(/_/g, "/"));
  const bytes = new Uint8Array(s.length);
  for (let i = 0; i < s.length; i++) bytes[i] = s.charCodeAt(i);
  return bytes;
}
async function pipeBytes(bytes, stream) {
  const out = new Response(new Blob([bytes]).stream().pipeThrough(stream));
  return new Uint8Array(await out.arrayBuffer());
}
async function shareLink() {
  const bytes = new TextEncoder().encode(src.value);
  let part = "u=" + toBase64Url(bytes);
  if (typeof CompressionStream === "function") {
    try { part = "z=" + toBase64Url(await pipeBytes(bytes, new CompressionStream("deflate-raw"))); } catch (e) { /* keep the plain form */ }
  }
  return part.length > LINK_LIMIT ? null : location.origin + location.pathname + "#" + part;
}
async function sourceFromLink() {
  const m = /^#([zu])=([A-Za-z0-9_-]+)$/.exec(location.hash);
  if (!m || m[2].length > LINK_LIMIT) return null;
  try {
    let bytes = fromBase64Url(m[2]);
    if (m[1] === "z") bytes = await pipeBytes(bytes, new DecompressionStream("deflate-raw"));
    return new TextDecoder("utf-8", { fatal: true }).decode(bytes);
  } catch (e) {
    notice(t("badLink"));
    return null;
  }
}

function baseName() {
  const raw = (model ? model.title : "song").normalize("NFKD").replace(/[^A-Za-z0-9]+/g, "-").replace(/^-+|-+$/g, "").toLowerCase();
  return raw || "song";
}

async function saveFile(name, data, kind) {
  const inClaude = !!(window.claude && typeof window.claude.use === "function");
  if (inClaude) {
    // inside Claude a page may only hand over a few file types: .mid goes in a .zip, .loma as .txt
    const downloads = await window.claude.use("downloads");
    if (!downloads) { notice(t("noSave")); return; }
    const payload = kind === "midi" ? { filename: baseName() + ".zip", data: zipOne(name, data) } : { filename: baseName() + ".txt", data: data };
    try {
      await downloads.save(payload);
      notice(kind === "midi" ? t("savedZip") : t("savedTxt"));
    } catch (e) {
      notice(e && e.code === "declined" ? t("declined") : t("noSave"));
    }
    return;
  }
  const url = URL.createObjectURL(new Blob([data], { type: kind === "midi" ? "audio/midi" : "text/plain" }));
  const a = document.createElement("a");
  a.href = url;
  a.download = name;
  document.body.append(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 2000);
  notice(t("saved"));
}

function setSource(text) {
  src.value = text;
  src.scrollTop = 0;
  playhead = 0;
  compile();
}

function openFile(file) {
  const reader = new FileReader();
  reader.onload = () => {
    const bytes = new Uint8Array(reader.result);
    try {
      if (bytes.length >= 4 && bytes[0] === 0x4D && bytes[1] === 0x54 && bytes[2] === 0x68 && bytes[3] === 0x64) {
        const r = LOMA.decompile(bytes);
        setSource(r.source);
        notice(t("loadedMidi")(r.warnings.length) + r.warnings.slice(0, 6).join("; "));
      } else {
        setSource(new TextDecoder("utf-8", { fatal: true }).decode(bytes));
        notice("");
      }
    } catch (e) {
      notice(t("badFile") + (e && e.message ? e.message : String(e)));
    }
  };
  reader.readAsArrayBuffer(file);
}

// ------------------------------------------------------------------ wiring
function applyLanguage() {
  document.documentElement.lang = lang;
  for (const el of document.querySelectorAll("[data-t]")) el.textContent = t(el.dataset.t);
  $("lang").textContent = lang === "it" ? "English" : "Italiano";
  $("linkSpec").href = "https://github.com/manuellomartire/loma/blob/main/" + (lang === "it" ? "SPEC.it.md" : "SPEC.md");
  $("linkPrompt").href = "https://github.com/manuellomartire/loma/blob/main/experiment/" + (lang === "it" ? "prompt.it.md" : "prompt.md");
  renderTheme();
  $("play").textContent = playing ? t("stop") : t("play");
  const sel = $("examples");
  sel.textContent = "";
  sel.append(new Option(t("example") + "…", ""));
  EXAMPLES.forEach((ex, i) => sel.append(new Option(ex.name, String(i))));
  const cheat = $("cheat");
  cheat.textContent = "";
  for (const [code, text] of t("cheat")) {
    const row = document.createElement("div"), c = document.createElement("code"), s = document.createElement("span");
    c.textContent = code;
    s.textContent = text;
    row.append(c, s);
    cheat.append(row);
  }
  renderStatus();
  if (model) renderFacts();
  draw();
}

// Typing or pasting does not compile: the Compile button (or Ctrl/⌘+Enter) does.
function markDirty() {
  renderGutter();
  store.set("loma-draft", src.value);
  if (dirty) return;
  dirty = true;
  roll.classList.add("stale");
  stop();
  $("play").disabled = true;
  $("saveMidi").disabled = true;
  renderStatus();
}
src.addEventListener("input", markDirty);
$("compile").addEventListener("click", compile);
src.addEventListener("scroll", () => { gutter.scrollTop = src.scrollTop; });
src.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) {
    e.preventDefault();
    compile();
    return;
  }
  if (e.key === "Tab" && !e.shiftKey && !e.ctrlKey && !e.metaKey && !e.altKey) {
    e.preventDefault();
    src.setRangeText("  ", src.selectionStart, src.selectionEnd, "end");
    src.dispatchEvent(new Event("input"));
  }
});
$("play").addEventListener("click", () => { if (playing) stop(); else play(); });
$("rewind").addEventListener("click", () => { const was = !!playing; stop(); playhead = 0; draw(); if (was) play(); });
$("volume").addEventListener("input", () => { if (playing) playing.master.gain.setTargetAtTime($("volume").value / 100, audio.currentTime, 0.01); });
const seek = (clientX) => {
  if (!model || model.end === 0) return;
  const r = roll.getBoundingClientRect(), was = !!playing;
  stop();
  playhead = Math.max(0, Math.min(1, (clientX - r.left) / r.width)) * model.end;
  draw();
  if (was) play();
};
roll.addEventListener("click", (e) => seek(e.clientX));
roll.addEventListener("keydown", (e) => {
  if (!model) return;
  if (e.key === " " || e.key === "Enter") { e.preventDefault(); if (playing) stop(); else play(); }
  if (e.key === "ArrowLeft" || e.key === "ArrowRight") {
    e.preventDefault();
    const r = roll.getBoundingClientRect();
    seek(r.left + r.width * Math.max(0, Math.min(1, playhead / model.end + (e.key === "ArrowRight" ? 0.02 : -0.02))));
  }
});
$("examples").addEventListener("change", (e) => {
  if (e.target.value !== "") { setSource(EXAMPLES[Number(e.target.value)].source); notice(""); }
  e.target.value = "";
});
$("file").addEventListener("change", (e) => { if (e.target.files[0]) openFile(e.target.files[0]); e.target.value = ""; });
const editor = $("editor");
editor.addEventListener("dragover", (e) => { e.preventDefault(); editor.classList.add("drag"); });
editor.addEventListener("dragleave", () => editor.classList.remove("drag"));
editor.addEventListener("drop", (e) => {
  e.preventDefault();
  editor.classList.remove("drag");
  if (e.dataTransfer.files[0]) openFile(e.dataTransfer.files[0]);
});
$("copy").addEventListener("click", () => copyText(src.value, $("copy"), "copy"));
$("copyErrors").addEventListener("click", () => copyText(errorsText(), $("copyErrors"), "copyErrors"));
$("share").addEventListener("click", () => {
  shareLink().then((url) => {
    if (url === null) notice(t("tooLong"));
    else { notice(""); copyText(url, $("share"), "share"); }
  });
});
$("theme").addEventListener("click", () => {
  const next = isDark() ? "light" : "dark";
  document.documentElement.setAttribute("data-theme", next);
  store.set("loma-theme", next);
});
$("saveMidi").addEventListener("click", () => { if (model && lastErrors.length === 0 && !dirty) saveFile(baseName() + ".mid", model.midi, "midi"); });
$("saveLoma").addEventListener("click", () => saveFile(baseName() + ".loma", src.value, "loma"));
$("lang").addEventListener("click", () => { lang = lang === "it" ? "en" : "it"; store.set("loma-lang", lang); applyLanguage(); });
window.addEventListener("resize", draw);
const repaint = () => { renderTheme(); draw(); };
if (window.matchMedia) window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", repaint);
new MutationObserver(repaint).observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });
if (document.fonts && document.fonts.ready) document.fonts.ready.then(draw);

// Standing alone (not embedded in another page) the page keeps the chosen theme and can share links.
const standalone = (() => { try { return window.self === window.top; } catch (e) { return false; } })();
if (standalone) {
  const theme = store.get("loma-theme");
  if (theme === "dark" || theme === "light") document.documentElement.setAttribute("data-theme", theme);
  $("share").hidden = false;
}
src.value = store.get("loma-draft") || EXAMPLES[0].source;
applyLanguage();
compile();
sourceFromLink().then((text) => { if (text !== null) setSource(text); });
window.addEventListener("hashchange", () => { sourceFromLink().then((text) => { if (text !== null) setSource(text); }); });
</script>
</body>
</html>
