# Publishes the package to PyPI when a GitHub release is published.
# It uses PyPI "trusted publishing": no password or token is stored in the repository.
# One-time setup on pypi.org: Account > Publishing > add a pending publisher with
# owner "manuellomartire", repository "loma", workflow "publish.yml", environment "pypi".
name: publish

on:
  release:
    types: [published]

jobs:
  pypi:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Tests
        run: python -m unittest discover -s tests
      - name: Build
        run: |
          python -m pip install build
          python -m build
      - uses: pypa/gh-action-pypi-publish@release/v1
