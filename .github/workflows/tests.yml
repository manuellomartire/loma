name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.12", "3.13"]
        include:
          # the oldest supported Python is no longer built for the newest Ubuntu image
          - os: ubuntu-24.04
            python-version: "3.9"
          - os: windows-latest
            python-version: "3.13"
          - os: macos-latest
            python-version: "3.13"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Unit tests, conformance suite and Python/JavaScript comparison
        run: python -m unittest discover -s tests
      - name: Conformance suite on the JavaScript implementation
        run: python conformance/run.py --cmd "node js/loma.js"
